<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Daily Story & Blog</title>
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        header { background: #1e293b; padding: 20px; text-align: center; border-bottom: 3px solid #38bdf8; }
        h1 { margin: 0; color: #38bdf8; }
        .container { max-width: 800px; margin: 20px auto; padding: 15px; }
        .admin-box { background: #1e293b; padding: 20px; border-radius: 8px; margin-bottom: 30px; border: 1px dashed #38bdf8; }
        .admin-box input, .admin-box textarea { width: 100%; padding: 10px; margin: 8px 0; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 4px; box-sizing: border-box; }
        .admin-box button { background: #38bdf8; color: #0f172a; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; border-radius: 4px; }
        .blog-card { background: #1e293b; padding: 20px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .blog-card img { width: 100%; max-height: 300px; object-fit: cover; border-radius: 5px; margin-bottom: 15px; }
        .blog-card h2 { color: #f1f5f9; margin-top: 0; }
        .blog-card p { color: #94a3b8; line-height: 1.6; }
        .toggle-btn { background: #334155; color: white; border: none; padding: 8px 15px; cursor: pointer; border-radius: 4px; margin-bottom: 15px; }
    </style>
</head>
<body>

    <header>
        <h1>📖 My Daily Story & Blog</h1>
        <p>Public stories indexed by search engines.</p>
    </header>

    <div class="container">
        <button class="toggle-btn" onclick="toggleAdmin()">✍️ Write New Story</button>
        
        <div id="adminPanel" class="admin-box" style="display: none;">
            <h3>New Story Post</h3>
            <input type="text" id="postTitle" placeholder="Story Title...">
            <input type="text" id="postImage" placeholder="Image URL...">
            <textarea id="postDesc" rows="4" placeholder="Write your story here..."></textarea>
            <button onclick="addNewPost()">Publish Story</button>
        </div>

        <div id="postsContainer">Loading stories...</div>
    </div>

    <script>
        function toggleAdmin() {
            const panel = document.getElementById('adminPanel');
            panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        }

        async function fetchPosts() {
            try {
                const response = await fetch('/api/posts');
                const posts = await response.json();
                const container = document.getElementById('postsContainer');
                container.innerHTML = '';

                if (posts.length === 0) {
                    container.innerHTML = '<p>No stories published yet.</p>';
                    return;
                }

                posts.forEach(post => {
                    container.innerHTML += `
                        <div class="blog-card">
                            <img src="${post.image}" alt="Story Image">
                            <h2>${post.title}</h2>
                            <p>${post.desc}</p>
                        </div>
                    `;
                });
            } catch (err) {
                console.error("Error loading posts", err);
            }
        }

        async function addNewPost() {
            const title = document.getElementById('postTitle').value;
            const image = document.getElementById('postImage').value;
            const desc = document.getElementById('postDesc').value;

            if(!title || !desc) {
                alert("Please fill in the title and description!");
                return;
            }

            const newPost = {
                title: title,
                image: image || 'https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=800',
                desc: desc
            };

            const response = await fetch('/api/posts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newPost)
            });

            const result = await response.json();
            if(result.success) {
                document.getElementById('postTitle').value = '';
                document.getElementById('postImage').value = '';
                document.getElementById('postDesc').value = '';
                document.getElementById('adminPanel').style.display = 'none';
                fetchPosts();
            }
        }

        fetchPosts();
    </script>
</body>
</html>
